<!DOCTYPE html>

<title>مضيف GoldHEN لإصدارات PS4 من 5.05 إلى 14.02 هوبي</title>

<style id="black-crown-theme">html,body{margin:0!important;min-height:100%!important;background:#060304 url('../black-crown-fast.jpg') center center / cover no-repeat fixed!important;color:#fff!important;font-family:Arial,Tahoma,sans-serif!important;text-align:center!important;overflow:hidden!important}body>h1:not(#msgs),body>hr,body>br,body>a,body>p{display:none!important}#msgs{position:fixed!important;top:auto!important;bottom:10%!important;left:19%!important;width:62%!important;margin:0!important;min-height:36px!important;padding:15px 12px!important;box-sizing:border-box!important;background:rgba(5,2,5,.88)!important;border:1px solid #a51324!important;border-radius:10px!important;box-shadow:0 0 20px #6a0918!important;color:#fff!important;font-size:22px!important;line-height:1.5!important;z-index:10!important}#bc-version{position:fixed;top:49%;left:32%;width:36%;text-align:center;font:bold 20px Arial;color:#fff;text-shadow:0 0 9px #f00;z-index:9}#bc-track{position:fixed;bottom:6%;left:22%;width:56%;height:10px;border-radius:20px;background:#26060b;border:1px solid #f22;box-shadow:0 0 10px #f22;overflow:hidden;z-index:11}#bc-fill{height:100%;width:8%;background:linear-gradient(90deg,#910017,#ff2038,#ffadb7);transition:width .2s} @media(max-width:700px){#msgs{left:5%!important;width:90%!important;bottom:12%!important;font-size:15px!important}#bc-track{left:8%;width:84%;bottom:7%}#bc-version{left:10%;width:80%;top:52%;font-size:16px}}#bc-version{position:fixed!important;top:0!important;left:0!important;width:auto!important;min-width:130px!important;transform:translate(-50%,-50%)!important;z-index:20!important;direction:ltr!important;text-align:center!important;font:bold 38px Arial,Tahoma,sans-serif!important;font-style:italic!important;color:#fff!important;text-shadow:0 0 4px #fff,0 0 12px #f00,0 0 23px #d00!important;white-space:nowrap!important;pointer-events:none!important}</style></head>
<body>
<script>

function DLProgress(e){Percent=e.total?Math.round(e.loaded / e.total * 100):0;window.msgs.innerHTML="جارٍ تثبيت التخزين المؤقت: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="تم تثبيت التخزين المؤقت بنجاح ✔";setTimeout(function(){window.location.replace("index.html");},900);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
function ActivateCacheUpdate(){try{window.applicationCache.swapCache();}catch(e){window.msgs.innerHTML="تم تنزيل التخزين المؤقت لكن تعذّر تفعيله. أغلق المتصفح وافتحه ثم حاول مجدداً.";return;}DisplayCacheProgress();}window.applicationCache.onupdateready=ActivateCacheUpdate;if(window.applicationCache.status==window.applicationCache.UPDATEREADY)ActivateCacheUpdate();
window.applicationCache.onerror=function(e){window.msgs.innerHTML="تعذّر تحديث التخزين المؤقت. ما زالت النسخة السابقة تعمل. تحقق من الاتصال ثم حاول مجدداً.";};
</script>

<hr>
<br>
<h1 id=msgs style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">جارٍ تثبيت التخزين المؤقت...</h1>

<div id="bc-version"></div><div id="bc-track"><div id="bc-fill"></div></div><script>(function(){var m=(navigator.userAgent||'').match(/PlayStation 4[ \/]([\d.]+)/i);/* firmware label is positioned by bc-firmware-dynamic */var msgs=document.getElementById('msgs'),fill=document.getElementById('bc-fill');function update(){var t=msgs.textContent||'';var p=t.match(/(\d{1,3})\s*%/);if(p){fill.style.width=Math.min(100,+p[1])+'%'}else if(/نجاح|اكتمل|تم تثبيت/.test(t)){fill.style.width='100%'}else if(/خطأ|تعذّر|غير مدعوم|لم يتم/.test(t)){fill.style.width='0%'}else{fill.style.width='12%'}}if(window.MutationObserver){new MutationObserver(update).observe(msgs,{childList:true,characterData:true,subtree:true})}update()})();</script><script id="bc-firmware-dynamic">(function(){
var el=document.getElementById('bc-version');if(!el)return;
var ua=navigator.userAgent||'';var m=ua.match(/PlayStation 4[ \/]([0-9]+(?:\.[0-9]+)?)/i);
el.textContent=m?m[1]:'--.--';
function place(){var w=window.innerWidth,h=window.innerHeight,s=Math.max(w/1672,h/941),ox=(w-1672*s)/2,oy=(h-941*s)/2;el.style.left=(ox+845*s)+'px';el.style.top=(oy+519*s)+'px';el.style.fontSize=Math.max(16,Math.min(45,38*s))+'px';}
place();window.addEventListener('resize',place);
})();</script></body>
